# The single required check for branch protection. It runs regardless of
# the other jobs' outcomes so its step summary always renders the per-job
# report, mirrors a pretty report onto PRs as a marker-tagged comment
# (updated in place, never stacked), then fails unless every other job
# succeeded. Callers pass their own job id as `wrapper` so the report
# excludes the wrapper and this job itself.
name: final-gate
on:
  workflow_call:
    inputs:
      wrapper:
        description: caller job id — excluded from the report alongside this job
        type: string
        required: true

permissions:
  actions: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: summary + gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Collect every job of this run except the wrapper and this job.
          jobs=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[.jobs[] | select((.name | split(" / ") | last) != "${{ github.job }}" and (.name | split(" / ") | last) != "${{ inputs.wrapper }}") | {name: (.name | split(" / ") | last), conclusion: .conclusion}]' \
            | jq 'sort_by(.conclusion == "success")')
          failed=$(echo "$jobs" | jq '[.[] | select(.conclusion != "success")] | length')
          if [ "$failed" -gt 0 ]; then
            echo "## CI failed ❌ — $failed job(s) failed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## CI passed ✅" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: [${{ github.repository }}#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · commit [\`${GITHUB_SHA:0:8}\`](${{ github.server_url }}/${{ github.repository }}/commit/$GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          rows=$(echo "$jobs" | jq -r '.[] | . as $j | "| \($j.name) | \((if $j.conclusion == "success" then "✅ success" elif $j.conclusion == "failure" then "❌ failure" elif $j.conclusion == "cancelled" then "🚫 cancelled" elif $j.conclusion == "skipped" then "⏭️ skipped" else "⏳ \($j.conclusion // "in progress")" end)) |"')
          echo "$rows" >> "$GITHUB_STEP_SUMMARY"

          # On PR-triggered runs, mirror a prettier report onto the PR:
          # status header, pass tally, collapsible job table — creating or
          # updating the bot's marker-tagged comment instead of stacking a
          # new comment per run. The marker is repo-specific so the same
          # bot account never collides across repositories.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            marker='<!-- events-ci-report -->'
            pr="${{ github.event.pull_request.number }}"
            passed=$(echo "$jobs" | jq '[.[] | select(.conclusion == "success")] | length')
            total=$(echo "$jobs" | jq 'length')
            if [ "$failed" -gt 0 ]; then
              title="### CI Report ❌"
            else
              title="### CI Report ✅"
            fi
            printf '%s\n' \
              "$marker" '' "$title" '' \
              "**$passed/$total jobs passed** · [Run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · commit [\`${GITHUB_SHA:0:8}\`](${{ github.server_url }}/${{ github.repository }}/commit/$GITHUB_SHA)" \
              '' '<details>' '<summary>Job results</summary>' '' \
              '| Job | Result |' '|---|---|' "$rows" \
              '</details>' '' '---' \
              '🤖 Updated automatically on every run by [final-gate](${{ github.server_url }}/${{ github.repository }}/actions/workflows/final-gate.yml)' \
              '⛔ This check must pass before merging' \
              > "$RUNNER_TEMP/pr-comment.md"
            pr_body=$(cat "$RUNNER_TEMP/pr-comment.md")
            existing=$(gh api "repos/${{ github.repository }}/issues/$pr/comments" \
              --jq '.[] | select(.body | contains("<!-- events-ci-report -->")) | .id' | head -1)
            if [ -n "$existing" ]; then
              gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$existing" -f body="$pr_body" > /dev/null
            else
              gh api "repos/${{ github.repository }}/issues/$pr/comments" -f body="$pr_body" > /dev/null
            fi
          fi
          test "$failed" -eq 0
