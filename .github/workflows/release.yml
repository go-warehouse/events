# Releases: a pushed version tag runs the full gate — quality then the
# cross-compile matrix — and only then creates the GitHub Release. Because
# the Go module proxy resolves version tags directly, the release name IS
# the `go get` version, so the tag shape is validated strictly. No manual
# dispatch: it can only run on branches, which can never be valid version
# tags — releases come from tags.
#
# Cut a release with:
#   git tag v1.2.3 && git push origin v1.2.3
name: release
on:
  push:
    # v1.2.3 or release candidates like v1.2.3-rc1 — anything else is
    # ignored by this workflow.
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

# contents: write — the only workflow that creates releases.
permissions:
  contents: write

jobs:
  # A release must pass the same gates as any commit: vet, race,
  # coverage >= 80%, and lint.
  quality:
    uses: ./.github/workflows/quality.yml

  # And the same five cross-compiles as main — a release that doesn't
  # build everywhere must not publish.
  build:
    needs: [quality]
    uses: ./.github/workflows/build.yml

  release:
    needs: [quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser's changelog needs commits since the last tag
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod # the module pins its own toolchain
          cache: true
      # The trigger pattern is a first filter; this rejects a pattern
      # edge case before anything is published.
      - name: validate version tag
        run: |
          tag="$GITHUB_REF_NAME"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]* | v[0-9]*.[0-9]*.[0-9]*-rc[0-9]*)
              echo "releasing $tag" ;;
            *)
              echo "tag $tag is not a vX.Y.Z or vX.Y.Z-rcN version tag" >&2
              exit 1 ;;
          esac
      # Installed as a direct binary rather than an action: the version is
      # pinned explicitly and matches the local toolchain (same pattern as
      # golangci-lint in quality.yml).
      - name: goreleaser v2.17.1 (direct binary)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/goreleaser/goreleaser/releases/download/v2.17.1/goreleaser_Linux_x86_64.tar.gz | tar xz -C "$HOME/.local/bin" goreleaser
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          goreleaser --version
      # The release body is the changelog grouped from conventional commit
      # prefixes (feat/fix/docs) since the previous tag — no commit dump,
      # no manual notes. goreleaser creates the release itself.
      - name: create release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: goreleaser release --clean
